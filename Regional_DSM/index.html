<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="connect-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'"><title>Regional DSM Data Processing</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f6f5;color:#183730;font:16px/1.5 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:40px 18px}h1{font-size:clamp(28px,5vw,46px);letter-spacing:-.04em;margin:0}h2{font-size:20px;margin:0 0 12px}section{background:white;border:1px solid #cadbd6;border-radius:14px;padding:20px;margin:16px 0}label{display:block;font-weight:600;margin:8px 0}select,input,button{font:inherit;max-width:100%;padding:8px;border:1px solid #acbfb8;border-radius:6px;background:white}button{cursor:pointer;background:#086754;color:white;font-weight:650;padding:9px 16px}button:disabled{opacity:.45}details{margin:10px 0}summary{cursor:pointer}.scroll{overflow:auto}table{border-collapse:collapse;font-size:14px;width:100%}th,td{padding:8px;border-bottom:1px solid #d9e5de;white-space:nowrap;text-align:right}th{background:#eaf3ef}fieldset{border:0;padding:0;margin:0}p{margin:8px 0}#msg{color:#694719}
</style></head><body><main><h1>Regional DSM Data Processing</h1><p>Combine scheduling data for one plant. All processing takes place in this browser, including offline.</p>
<fieldset id="controls"><section><h2>Source files</h2><label>Region <select id="region"><option>NRPC</option><option>WRPC</option><option>SRPC</option></select></label><label id="modeLabel" hidden>Read WRPC plant name from <select id="mode"><option value="auto">Automatic</option><option value="column">Plant column</option><option value="above">Text above table</option><option value="filename">Filename</option></select></label><label for="files" id="format"></label><input id="files" type="file" multiple><p id="inventory"></p></section>
<section id="selection" hidden><h2>Plant selection</h2><label>Plant <select id="plant"></select></label><div id="maps"></div><button id="run">Check and combine files</button></section></fieldset>
<p role="status" id="msg"></p><section id="output" hidden><h2>Combined data</h2><p id="stats"></p><div id="issues"></div><p><button id="csv">Download combined CSV</button> <button id="excel">Download Excel</button></p><p id="caption"></p><div class="scroll"><table id="preview"></table></div></section></main><script src="vendor/xlsx.full.min.js"></script><script src="vendor/jszip.min.js"></script><script src="processor.js"></script><script src="app.js"></script></body></html>
